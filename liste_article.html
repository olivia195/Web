<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Formulaire Article</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background: url('image/Vendasdecomercio.jpeg') no-repeat center center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5); /* intensité de l'ombre */
    z-index:0;
}

.form-container{
    position:relative;
    z-index:1;
    width:400px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
    text-shadow:0 2px 10px rgba(0,123,255,0.3);
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group i{
    position:absolute;
    left:10px;
    top:12px;
    color:#777;
}

.input-group input{
    width:100%;
    padding:12px 12px 12px 35px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fafafa;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#007BFF;
    box-shadow:0 0 6px rgba(0,123,255,0.3);
    background:#fff;
}

.input-group label{
    position:absolute;
    left:35px;
    top:12px;
    font-size:13px;
    color:#777;
    transition:0.3s;
    background:#fff;
    padding:0 5px;
}

.input-group input:focus + label,
.input-group input:valid + label{
    top:-8px;
    font-size:11px;
    color:#007BFF;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007BFF;
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    box-shadow:0 5px 15px rgba(0,123,255,0.3);
}

.buttons{
    display:flex;
    gap:10px;
}

.buttons button{
    flex:1;
}

.btn-reset{
    background:#dc3545;
}

.btn-reset:hover{
    background:#a71d2a;
    box-shadow:0 5px 15px rgba(220,53,69,0.3);
}

</style>
</head>

<body>

<div class="form-container">
    <h2>Article</h2>

    <form method="post" action="action.php">
        <div class="input-group">
            <i class="fas fa-hashtag"></i>
            <input type="text" id="id_article" name="id_article" required>
            <label for="id_article">Id_article</label>
        </div>

        <div class="input-group">
            <i class="fas fa-pencil-alt"></i>
            <input type="text" id="design" name="design" required>
            <label for="design">Design</label>
        </div>

        <div class="input-group">
            <i class="fas fa-dollar-sign"></i>
            <input type="number" id="prix" name="prix" required>
            <label for="prix">Prix</label>
        </div>

        <div class="input-group">
            <i class="fas fa-list"></i>
            <input type="text" id="categorie" name="categorie" required>
            <label for="categorie">Catégorie</label>
        </div>

<div class="buttons">
    <button type="reset" class="btn-reset">Effacer</button>
    <button type="submit">Valider</button>
</div>

    </form>
</div>

</body>
</html>
